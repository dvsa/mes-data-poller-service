name: CI

on:
  pull_request:
    branches:
      - develop
      - 'release-**'

jobs:
  clones-test-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clone DES Test Data Repo
        run: git clone https://x-access-token:${GITHUB_TOKEN}@github.com/dvsa/des-test-data-journal.git journal-test-data && mkdir -p test-data && rm -rf test-data/journals && mv journal-test-data/journals test-data/ && rm -rf journal-test-data
  runs-ci:
    needs: clones-test-data
    uses: dvsa/des-workflow-actions/.github/workflows/ci-backend.yaml@main
    secrets:
      DES_ACCESS_TOKEN: ${{ secrets.DES_ACCESS_TOKEN }}
